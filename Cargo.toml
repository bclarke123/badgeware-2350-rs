[package]
name = "tufty-2350"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Procedural tree garden and e-paper apps for Pimoroni's RP2350 badges (Tufty 2350, Badger 2350)"
publish = false

[dependencies]
embassy-executor = { version = "0.10.0", features = ["platform-cortex-m", "executor-thread"] }
embassy-rp = { version = "0.10.0", features = [
    "time-driver",
    "critical-section-impl",
    "binary-info",
    "unstable-pac",
] }
embassy-time = "0.5.1"
embassy-sync = "0.8.0"
embassy-futures = "0.1.2"
embassy-usb-logger = "0.6.0"
log = "0.4"

embedded-graphics = "0.8.2"
embedded-hal = "1.0"

fixed = "1.23"

cortex-m = "0.7"
cortex-m-rt = "0.7"
portable-atomic = { version = "1", features = ["critical-section"] }
static_cell = "2.1"
heapless = "0.9"
rand_core = "0.9"
qrcodegen-no-heap = "1.8"
u8g2-fonts = { version = "0.8", features = ["embedded_graphics_textstyle"] }
hmac = { version = "0.12", default-features = false }
sha1 = { version = "0.10", default-features = false }
cyw43 = "0.7"
cyw43-pio = "0.10"
embedded-io-async = "0.7"
embassy-net = { version = "0.9", features = ["proto-ipv4", "medium-ethernet", "tcp", "udp", "dns", "dhcpv4"] }

[features]
default = ["tufty"]
# Pimoroni Tufty 2350: RP2350B, 320x240 ST7789 LCD on an 8-bit parallel bus.
tufty = ["embassy-rp/rp235xb"]
# Pimoroni Badger 2350: RP2350A, 264x176 four-grey SSD1680 e-paper on SPI0.
badger = ["embassy-rp/rp235xa"]

[[example]]
name = "epd_test"
required-features = ["badger"]

[[example]]
name = "badge"
required-features = ["badger"]

[[example]]
name = "totp"
required-features = ["badger"]

[[example]]
name = "weather"
required-features = ["badger"]

[lints.rust]
ambiguous_negative_literals = "warn"
redundant_imports = "warn"
redundant_lifetimes = "warn"
trivial_numeric_casts = "warn"
unsafe_op_in_unsafe_fn = "warn"
unused_lifetimes = "warn"

[lints.clippy]
complexity = { level = "warn", priority = -1 }
correctness = { level = "warn", priority = -1 }
perf = { level = "warn", priority = -1 }
style = { level = "warn", priority = -1 }
suspicious = { level = "warn", priority = -1 }
allow_attributes_without_reason = "warn"
semicolon_outside_block = "warn"
undocumented_unsafe_blocks = "warn"
unused_result_ok = "warn"

[profile.release]
debug = 2          # symbols stay on the host side; they never reach flash
lto = "fat"
opt-level = 3      # display/game hot paths matter more than binary size (16MB flash)
codegen-units = 1

[profile.dev]
opt-level = 1      # opt-level 0 is unusably slow for pixel pushing
