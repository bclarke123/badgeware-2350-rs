[package]
name = "tufty-2350"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Embassy-based framework and Simon memory game for the Pimoroni Tufty 2350 badge"
publish = false

[dependencies]
embassy-executor = { version = "0.10.0", features = ["platform-cortex-m", "executor-thread"] }
embassy-rp = { version = "0.10.0", features = [
    "rp235xb",
    "time-driver",
    "critical-section-impl",
    "binary-info",
    "unstable-pac",
] }
embassy-time = "0.5.1"
embassy-sync = "0.8.0"
embassy-futures = "0.1.2"
embassy-usb-logger = "0.6.0"
log = "0.4"

embedded-graphics = "0.8.2"
embedded-hal = "1.0"

fixed = "1.23"

cortex-m = "0.7"
cortex-m-rt = "0.7"
portable-atomic = { version = "1", features = ["critical-section"] }
static_cell = "2.1"
heapless = "0.9"
rand_core = "0.9"

[lints.rust]
ambiguous_negative_literals = "warn"
redundant_imports = "warn"
redundant_lifetimes = "warn"
trivial_numeric_casts = "warn"
unsafe_op_in_unsafe_fn = "warn"
unused_lifetimes = "warn"

[lints.clippy]
complexity = { level = "warn", priority = -1 }
correctness = { level = "warn", priority = -1 }
perf = { level = "warn", priority = -1 }
style = { level = "warn", priority = -1 }
suspicious = { level = "warn", priority = -1 }
allow_attributes_without_reason = "warn"
semicolon_outside_block = "warn"
undocumented_unsafe_blocks = "warn"
unused_result_ok = "warn"

[profile.release]
debug = 2          # symbols stay on the host side; they never reach flash
lto = "fat"
opt-level = 3      # display/game hot paths matter more than binary size (16MB flash)
codegen-units = 1

[profile.dev]
opt-level = 1      # opt-level 0 is unusably slow for pixel pushing
